name: Deploy to Firebase Hosting

# Runs on every push to the working branch (and main, if you merge there),
# and can also be triggered by hand from the Actions tab.
on:
  push:
    branches:
      - main
      - claude/hebrew-work-tracker-pwa-m0mv4q
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project work-ccd39 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
