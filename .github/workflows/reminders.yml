name: Send daily reminders

# Runs on a schedule (every 30 min) and can be triggered by hand to test.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-save web-push firebase-admin

      - name: Send reminders
        run: node scripts/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: BGR9gWrzzQ4QYibp7qpStgjcm5uPRdZ4f4NwiXDdFTi1OxrZb7w03GWmQK6UTAo9PZIev32Fn4StZCD1XNa5W6Y
          VAPID_SUBJECT: mailto:ohav88@gmail.com
