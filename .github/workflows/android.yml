name: Build for Google Play

# Every push to the working branch builds the signed Android App Bundle (AAB)
# for Google Play, keeps it as a run artifact, and — once the Play service
# account secret exists — sends it to Play by itself.
#
# GitHub releases stopped at v92 (2026-11-12): that APK and its in-app updater
# stay exactly as they are for whoever still has it, and the updater never sees
# a newer release. From here on the app is distributed by Google Play only.
on:
  push:
    branches:
      - main
      - claude/hebrew-work-tracker-pwa-m0mv4q
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design-system/**'
      - 'store/**'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/play-listing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The first upload of a new app must be made by hand in Play Console;
      # until the app has been sent for review once, Play only accepts drafts.
      PLAY_TRACK: internal
      PLAY_STATUS: draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 22, not 20: the Capacitor CLI refuses to run on anything older.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Copy web assets and sync the native project
        run: |
          node scripts/build-web.mjs
          npx cap sync android

      # The auth plugin only builds a provider's handler if that provider is
      # listed in the config, and reports the omission only at sign-in time on
      # the device. Cheaper to fail here.
      - name: Check the sign-in provider is configured
        run: |
          node -e "
            const c = require('./android/app/src/main/assets/capacitor.config.json');
            const p = ((c.plugins || {}).FirebaseAuthentication || {}).providers || [];
            if (!p.includes('google.com')) { console.error('google.com missing from FirebaseAuthentication.providers'); process.exit(1); }
            console.log('Sign-in providers:', p.join(', '));
          "

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # versionCode must only ever go up on Play. 1000 + the run number stays
      # clear of the codes the old GitHub APKs used (1..~30).
      - name: Stamp the version
        id: version
        run: |
          APP_VERSION=$(grep -oP "APP_VERSION = '\\Kv[0-9]+" js/app.js)
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "name=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode 1$/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          echo "Building $APP_VERSION (code $CODE)"

      # The upload key is the same key the GitHub APKs were signed with
      # (ANDROID_KEYSTORE_*). Play re-signs the app with its own app-signing
      # key; this one only proves the upload came from us.
      - name: Decode the upload key
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing: Play needs a signed bundle."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          keytool -list -v -keystore android/app/release.jks -alias work-log \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep -E "SHA1|SHA256" || true

      - name: Build the bundle
        working-directory: android
        env:
          WL_KEYSTORE_FILE: release.jks
          WL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WL_KEY_ALIAS: work-log
          WL_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Permissions in the bundle
        run: |
          unzip -p android/app/build/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml \
            | grep -ao 'android.permission.[A-Z_]*' | sort -u
          if unzip -p android/app/build/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml \
            | grep -aq 'REQUEST_INSTALL_PACKAGES\|SCHEDULE_EXACT_ALARM'; then
            echo "::error::A permission Google Play restricts is back in the bundle."
            exit 1
          fi

      - name: Name the bundle
        id: aab
        run: |
          OUT="work-log-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: work-log-play-bundle
          path: ${{ steps.aab.outputs.path }}
          retention-days: 30

      - name: Is the Play service account set up?
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "upload=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret yet: the bundle is only kept as an artifact."; fi

      - name: Send to Google Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.worklog.hours
          releaseFiles: ${{ steps.aab.outputs.path }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}
